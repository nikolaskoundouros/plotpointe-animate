<body>
<div class="dot"></div>
<main id="app"></main>
<script>document.write('<script src="data/story.js?'+Date.now()+'"><\/script>')</script><!-- data is asked for fresh every time, like the live setting below -->
<script>document.write('<script src="data/scripts.js?'+Date.now()+'"><\/script>')</script>
<script>document.write('<script src="data/storyboards.js?'+Date.now()+'"><\/script>')</script>
<script>document.write('<script src="data/live.js?'+Date.now()+'"><\/script>')</script><!-- asked for fresh every time: the browser must never show yesterday's answer to "is Blender live" -->
<script>
// The storyboards, copied from their source files by tools/build_data.py. The page only reads them.
const STORIES=window.STORIES;
const SCRIPTS=window.SCRIPTS||[];
const STORYBOARDS=window.STORYBOARDS||{};   // doc id -> the storyboard PlotPointe made for that script, when it matches the script word for word   // one per script, from tools/make_folders.py: every script starts at step 1 on the day its folder was made
const LIVE=window.LIVE&&!(window.LIVE.untilMs<=Date.now())?window.LIVE:null;   // {story, shots, url, api, until, untilMs} while a real Blender is being streamed, else null
if(LIVE&&LIVE.untilMs)setTimeout(()=>location.reload(),LIVE.untilMs-Date.now()+1500);   // when the machine stops, go back to the pictures
const liveShots=LIVE?(LIVE.shots||[LIVE.shot]):[];   // the shots that one live Blender can open
const app=document.getElementById("app"),store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==="on")for(const[n,f]of Object.entries(v))e.addEventListener(n,f);else if(a==="class")e.className=v;else e[a]=v}e.append(...k.filter(x=>x!=null));return e};

// What the animator has done so far, kept in this browser only: which shot is open, and which shots have been generated.

// Talking to the live Blender (tools/live/pp_live.py). One question every two seconds tells the page everything:
// which shot is open, the steps while a shot is opening, what was saved last, the chat, and the model's current step.
let liveAsked=null;                                  // the shot Blender was last asked to open
let liveState=null,liveDown=false;                   // Blender's last answer; true when it did not answer
let opening=null;                                    // {shot, steps, step, since} while Blender is opening a shot: its own steps, by name
const canChat=()=>!!(LIVE&&LIVE.api&&LIVE.story===S.id);
const clock=sec=>new Date(sec*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false});
function liveTag(){
  const r=liveState,shot=liveAsked;

    :!r||!LIVE.api?"":r.last&&r.last.shot===shot?"saved "+clock(r.last.at)+" · copy "+r.count:r.count?"your saved copy "+r.count+" is open":"nothing changed yet";

const showTag=()=>{const t=document.querySelector(".livewin")&&document.querySelector(".tag");if(t)t.textContent=liveTag()};
// The loading steps over the Blender window: every line is a step Blender itself reported, the running one has the moving bar.
function showOpening(){

  const old=stage.querySelector(".opening");
  if(!opening){if(old)old.remove();return}
  const steps=opening.steps.length?opening.steps:["Asking Blender for the "+opening.shot+" scene"];
  const sig=opening.shot+"|"+steps.join("|")+"|"+opening.step,head="Opening the "+opening.shot+" scene · "+Math.round((Date.now()-opening.since)/1000)+" s";
  if(old&&old.dataset.sig===sig){old.querySelector(".label").textContent=head;return}   // same step: only the seconds move
  const el=h("div",{class:"opening"},h("div",{class:"card"},h("span",{class:"label",textContent:head}),
    ...steps.map((t,n)=>h("div",{class:"job"+(n<opening.step?" done":n===opening.step?" now":"")},h("span",{textContent:t}),h("div",{class:"bar"},h("i"))))));
  el.dataset.sig=sig;old?old.replaceWith(el):stage.append(el);

// The chat: what the animator wrote, what the model answered, and the step the model is on right now.
function showChat(){
  const log=document.querySelector(".chat-log");if(!log)return;
  const r=liveState,msgs=r&&r.chat||[],busy=r&&r.model&&r.model.busy?r.model.step:"";
  const sig=msgs.length+"|"+busy+"|"+liveDown+"|"+outbox.map(o=>o.state).join(",");
  if(log.dataset.sig===sig)return;log.dataset.sig=sig;
  const waiting=!busy&&!outbox.length&&msgs.length&&msgs[msgs.length-1].who==="you";
  log.replaceChildren(...[...msgs.map(m=>h("div",{class:"msg "+(m.who==="you"?"you":"model"),textContent:m.text})),
    ...outbox.map(o=>h("div",{class:"msg you pending"+(o.state==="failed"?" failed":"")},h("span",{textContent:o.text}),
      o.state==="failed"?h("span",{class:"note"},"Not sent. The line to Blender is down. ",h("button",{class:"text",textContent:"Try again",on:{click:()=>{outbox.splice(outbox.indexOf(o),1);say(o.text)}}})):h("span",{class:"note",textContent:"Sending…"}))),
    busy?h("div",{class:"job now"},h("span",{textContent:busy}),h("div",{class:"bar"},h("i")),
      h("button",{class:"text",textContent:"Stop",on:{click:()=>say("Stop.")}})):null,
    waiting?h("div",{class:"job now"},h("span",{textContent:"Sent. The model is picking it up"}),h("div",{class:"bar"},h("i"))):null,   // so the animator sees at once that the line arrived
    liveDown?h("div",{class:"msg model",textContent:"Cannot reach Blender."}):null].filter(Boolean));

}
function heard(r){
  liveState=r;liveDown=false;
  if(liveAsked){
    if(r.error)opening=null;
    else if(r.shot!==liveAsked||r.opening){const mine=r.opening===liveAsked;   // not on screen yet: show Blender's own steps
      opening={shot:liveAsked,steps:mine?r.steps:[],step:mine?r.step:0,since:opening?opening.since:Date.now()}}
    else opening=null}
  showTag();showOpening();showChat();
}
const lost=()=>{liveDown=true;opening=null;showTag();showOpening();showChat()};
const wire=(path,opt={},ms=7000)=>{const stop=new AbortController(),t=setTimeout(()=>stop.abort(),ms);   // gives up after ms: a dead line must show, not hang
  return fetch(LIVE.api+path,{...opt,signal:stop.signal}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).finally(()=>clearTimeout(t))};
const poll=()=>wire("/status").then(heard).catch(lost);
function openLive(shot){
  if(!LIVE.api||liveAsked===shot)return;
  liveAsked=shot;opening={shot,steps:[],step:0,since:Date.now()};showTag();showOpening();
  wire("/open?shot="+encodeURIComponent(shot)).then(heard).catch(lost);
}
// The instant buttons: each one is a ready-made tool inside the live Blender (tools/live/pp_live.py), no AI in between.

}
// What the animator typed shows in the chat at once, marked "sending". It leaves this list when Blender has it
// (the real line then comes back from Blender), or turns into "not sent" with a button to try again.
const outbox=[];
function say(text){
  const mine={text,state:"sending",shot:S.shots[work.at].short||""};outbox.push(mine);showChat();
  wire("/say?shot="+encodeURIComponent(mine.shot),{method:"POST",body:text},9000)
    .then(()=>poll().finally(()=>{outbox.splice(outbox.indexOf(mine),1);showChat()}))   // Blender has it: its own copy of the line is now in the chat
    .catch(()=>{mine.state="failed";showChat()});

// The process, in order: the seven checkpoints (Nick, 13 Nov: "idea, script, storyboard, preview (animate), sfx, captions, publish").
// Every script is one folder in Drive and goes through all seven.
const FLOW=[["Idea",["Waiting for approval","Approved"]],["Script",["Waiting for edit and approval","Approved"]],["Storyboard",["Not started","Written","Approved"]],
  ["Preview",["Not started","In Blender","Preview ready"]],["SFX",["Not started","Added","Approved"]],["Captions",["Not started","Added","Approved"]],["Publish",["Not published","Published"]]];
const N=FLOW.length,ALL=[...FLOW.keys()];
const STAGES=[["Ideas","Every script starts as an idea. Write one and approve it, and it moves on to Scripts."],
  ["Scripts","The script is written from the approved idea. Edit and approve it here, and it moves on to Storyboard."],
  ["Storyboard","The storyboard is drawn for each approved script. Approve it and the script moves on to Preview."],
  ["Preview","Approved storyboards become a moving preview in Blender, one shot at a time."],
  ["SFX","Sound effects and music under the preview. Approve them and the script moves on to Captions."],
  ["Captions","The words on screen, timed to the narration. Approve them and the script moves on to Publish."],
  ["Publish","The finished video, ready to upload. Uploading is done by hand."]];
const EMPTY=["There are no ideas yet.","No idea is approved yet. Approve one in Ideas and it appears here.","No script is approved yet. Approve one in Scripts and it appears here.",
  "No storyboard is approved yet. Approve one in Storyboard and it appears here.","No preview is ready yet. Finish one in Preview and it appears here.",
  "No sound is approved yet. Approve it in SFX and it appears here.","No captions are approved yet. Approve them in Captions and it appears here."];
// Where each later step keeps its files in the script's Drive folder.
const STEP_DIRS={2:["02 Storyboard"],3:["03 Blend","04 Clips and final video"],4:["05 Sound"],5:["06 Captions"],6:["07 Publish"]};
let FILES={};                                        // what the page's server found in each script's step folders
const fileUrl=(sc,dir,name)=>"api/file?folder="+encodeURIComponent(sc.folder)+"&step="+encodeURIComponent(dir)+"&name="+encodeURIComponent(name);
const drivePics=sc=>((FILES[sc.folder]||{})["02 Storyboard"]||[]).filter(f=>/\.(jpe?g|png|webp)$/i.test(f)).map(f=>fileUrl(sc,"02 Storyboard",f));
const sKey=sc=>"pp_script_"+sc.folder;
// One script's work: at/on = how far each step has got and the day; html/text = the script as edited; log = every change; sessions = stretches of work.
// A record from before Idea, SFX and Captions were steps had four: script, storyboard, animate, publish. Its idea counts as approved.
const OLD=[1,2,3,6];
const upgrade=w=>{if(w&&Array.isArray(w.at)&&w.at.length===4){const move=(a,fill)=>{const b=Array(N).fill(fill);OLD.forEach((k,i)=>b[k]=a&&a[i]!=null?a[i]:fill);return b};
  w.at=move(w.at,0);w.at[0]=1;w.on=move(w.on,null);if(w.re)w.re=move(w.re,null)}return w};
const sRead=sc=>{let w;try{w=upgrade(JSON.parse(store.get(sKey(sc))))}catch(e){}
  if(!(w&&Array.isArray(w.at)&&w.at.length===N)){w={at:Array(N).fill(0),on:Array(N).fill(null)};if(sc.made!=="platform")w.at[0]=1}   // scripts from the writers' docs came with their idea
  w.log=w.log||[];w.sessions=w.sessions||[];return w};
// Saving: always in this browser; and, when the page's own server answers (tools/serve.py), to PlotPointe's copy and the script's Drive folder.
let remote=false,view=null,savedAt=0;                // view = how to redraw the screen that is showing
const push=(sc,w)=>{if(!remote)return;
  fetch("api/save?folder="+encodeURIComponent(sc.folder),{method:"POST",keepalive:true,body:JSON.stringify({state:w,text:w.text||sc.lines})})
    .then(r=>{if(r.ok){savedAt=Date.now();const el=document.querySelector(".savedat");if(el)el.textContent=savedLine()}}).catch(()=>{})};
const sSave=(sc,w)=>{store.set(sKey(sc),JSON.stringify(w));push(sc,w)};
const savedLine=()=>!remote?"Kept in this browser only: the page's server is not running.":savedAt?"Saved to this script's Drive folder at "+clock(savedAt/1000):"Every change is saved to this script's Drive folder.";
// A work session opens at the first change, and closes after 5 minutes without one; the next change opens a new session.
const IDLE=5*60*1000;
function note(w,what,line,before,after,who="you"){
  const now=Date.now(),last=w.sessions[w.sessions.length-1];
  if(last&&now-last.end<=IDLE){last.end=now;last.changes++}else w.sessions.push({start:now,end:now,changes:1});
  w.log.push({at:now,who,what,line,before,after});
}
// What differs between two versions of the script: the first changed line, and the changed stretch before and after. null = nothing.
function span(prev,cur){
  let a=0,b=0;
  while(a<prev.length&&a<cur.length&&prev[a]===cur[a])a++;
  while(b<prev.length-a&&b<cur.length-a&&prev[prev.length-1-b]===cur[cur.length-1-b])b++;
  return a===prev.length&&a===cur.length?null:{line:a+1,before:prev.slice(a,prev.length-b).join("\n"),after:cur.slice(a,cur.length-b).join("\n")};
}
// The marks, with the meanings PlotPointe already gives them in the writers' docs (telegram/gdocs.py).
const MARKS=[["Cut","strikeThrough",null,"Strike out what should go"],["My words","bold",null,"Words you wrote yourself"],
  ["Fluff","hiliteColor","rgb(255, 191, 102)","Filler that adds nothing"],["Flow","hiliteColor","rgb(158, 196, 255)","Does not flow from the line before"],
  ["Sense","hiliteColor","rgb(255, 153, 153)","Does not make sense"],["Keep","hiliteColor","rgb(153, 230, 153)","Good, keep it"]];
const TINT=Object.fromEntries(MARKS.filter(m=>m[2]).map(m=>[m[2],m[0].toLowerCase()]));
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const toHtml=lines=>lines.map(l=>"<p>"+esc(l).replace(/~~(.+?)~~/g,"<strike>$1</strike>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
  .replace(/\[(fluff|flow|sense|keep): (.+?)\]/g,(m,k,t)=>'<span style="background-color: '+MARKS.find(x=>x[0].toLowerCase()===k)[2]+'">'+t+"</span>")+"</p>").join("");
function marked(node){                               // a line's text with its marks written out: ~~cut~~, **my words**, [fluff: ...]
  if(node.nodeType===3)return node.nodeValue;
  if(node.nodeType!==1)return "";
  const inner=[...node.childNodes].map(marked).join("");
  if(!inner.trim())return inner;
  const st=node.style||{},tint=TINT[st.backgroundColor];
  if(/^(STRIKE|S|DEL)$/.test(node.tagName)||/line-through/.test(st.textDecorationLine||st.textDecoration||""))return "~~"+inner+"~~";
  if(/^(B|STRONG)$/.test(node.tagName)||/^(bold|[6-9]00)$/.test(st.fontWeight||""))return "**"+inner+"**";
  return tint?"["+tint+": "+inner+"]":inner;
}
const boxLines=box=>(box.children.length?[...box.children].map(marked):box.textContent.split("\n")).map(l=>l.replace(/ /g," ").trim()).filter(Boolean);
let leaveEdit=null;                                  // closes the change being typed, when the animator leaves the script

const sNow=w=>{const n=ALL.find(i=>!sDone(w,i));return n===undefined?N-1:n};   // the first step that is not finished

// A new idea, written in the platform: a title, the idea, and the script if it is written already. The page's server makes its Drive folder and record.

      SCRIPTS.push(r.script);SCRIPTS.sort((a,b)=>a.title.toLowerCase()<b.title.toLowerCase()?-1:1);

// One script: its seven steps, the day each was done, and the folder it lives in.
function scriptPage(sc){
  if(leaveEdit)leaveEdit();
  const w=sRead(sc);navOn(sNow(w));view=()=>scriptPage(sc);
  const save=()=>{sSave(sc,w);scriptPage(sc)};
  const when=()=>new Date().toISOString().slice(0,10);
  const ACTION=[["Approve idea"],["Approve script"],["Mark storyboard written","Approve storyboard"],["Start the preview","Mark preview ready"],
    ["Mark sound added","Approve sound"],["Mark captions added","Approve captions"],["Mark published"]];
  const advance=n=>{note(w,ACTION[n][w.at[n]],null,"","");w.at[n]++;w.on[n]=when();save()};
  const reopen=n=>{note(w,"Reopen "+FLOW[n][0].toLowerCase(),null,"","");w.at[n]=Math.max(0,FLOW[n][1].length-2);w.on[n]=when();w.re=w.re||Array(N).fill(null);w.re[n]=when();save()};   // approval never locks: back to editing, and the day is kept

  // The script itself: an editable box. Every change is recorded with its time, what it was before and what it is now.
  const editable=!sDone(w,1);
  const box=h("div",{class:"scriptbox",contentEditable:String(editable),spellcheck:true,ariaLabel:"The script",innerHTML:w.html||toHtml(sc.lines||[])||"<p><br></p>"});
  // The idea: written in the platform for a new script; the scripts from the writers' docs came with theirs.
  const ideaText=w.idea!=null?w.idea:sc.idea||"";
  const ideaBox=h("textarea",{class:"newtext ideabox",rows:3,value:ideaText,disabled:sDone(w,0),ariaLabel:"The idea",placeholder:sDone(w,0)?"Reopen the idea to change it":"The idea: the story in a sentence or two"});
  ideaBox.addEventListener("change",()=>{const after=ideaBox.value.trim();if(after===ideaText)return;note(w,"Idea edit",null,ideaText,after);w.idea=after;save()});
  // What is in this step's folder in Drive, by name.
  const inDrive=n=>(STEP_DIRS[n]||[]).filter(d=>n!==2||!STORYBOARDS[sc.doc]).map(d=>{const got=(FILES[sc.folder]||{})[d]||[];
    return h("div",{class:"state drivefiles"},d+" in Drive: "+(got.length?got.length+(got.length===1?" file · ":" files · ")+got.slice(0,4).join(", ")+(got.length>4?" ...":""):remote?"empty":"(needs the page's server)"))});
  const changes=h("div",{class:"changes"});
  const showChanges=()=>changes.replaceChildren(
    h("span",{class:"label",textContent:w.log.length?w.log.length+(w.log.length===1?" change · ":" changes · ")+w.sessions.length+(w.sessions.length===1?" work session":" work sessions"):"No changes yet. Everything you change here is recorded."}),
    ...w.sessions.slice(-2).reverse().map((x,i)=>h("div",{class:"fact",textContent:"Session "+(w.sessions.length-i)+" · "+clock(x.start/1000)+" to "+clock(x.end/1000)+" · "+x.changes+(x.changes===1?" change":" changes")})),
    ...w.log.slice(-5).reverse().map(c=>h("div",{class:"fact change"},h("span",{class:"label",textContent:clock(c.at/1000)+" · "+(c.who&&c.who!=="you"?c.who+" · ":"")+c.what+(c.line?" · line "+c.line:"")}),
      c.before?h("s",{textContent:c.before}):null,c.after?h("span",{textContent:c.after}):null)));
  let prev=boxLines(box),timer=0,lastMark="";
  const close=()=>{                                  // one change: what differs from the last recorded text
    clearTimeout(timer);timer=0;
    const cur=boxLines(box),ch=span(prev,cur);
    if(!ch){lastMark="";return}
    note(w,lastMark||"Edit",ch.line,ch.before,ch.after);
    w.mine=[...new Set([...(w.mine||[]),...ch.after.split("\n").filter(Boolean)])].filter(l=>cur.includes(l));   // the lines the writer edited: never changed without their click
    lastMark="";prev=cur;w.html=box.innerHTML;w.text=cur;sSave(sc,w);showChanges();

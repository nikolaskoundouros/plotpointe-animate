<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>

.steps{list-style:none;padding:0;margin-top:26px;font-size:22px;font-weight:300;letter-spacing:-.015em;line-height:2}

.nav{display:none;position:fixed;top:0;left:0;bottom:0;width:240px;z-index:1;flex-direction:column;gap:4px;padding:26px 16px;border-right:1px solid var(--line);background:var(--bg)}
.nav-on .nav{display:flex}

.nav .brand{padding:0 12px 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}

.nav button:nth-of-type(2){animation-delay:.25s}.nav button:nth-of-type(3){animation-delay:.5s}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}.compare-grid p{white-space:pre-wrap}.compare-notes{width:100%;min-height:80px;margin-top:20px;padding:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font:inherit}@media(max-width:620px){.compare-grid{grid-template-columns:1fr}}
.room{display:flex;flex-direction:column;gap:9px;margin-top:26px;max-width:560px}
.agent{display:flex;gap:10px;align-items:baseline;font-size:14px;line-height:1.45;animation:rise .35s ease both}

@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
.vsec{margin-top:44px}
.vsec>.label{display:block;margin-bottom:14px}
.bible{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.ent{border-top:1px solid var(--line);padding-top:14px;font-size:13px;line-height:1.55;color:var(--soft)}

.photos{display:flex;gap:6px;margin-top:10px}
.photos img{width:44px;height:44px;object-fit:cover;border-radius:6px;opacity:.85}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.shot{font-size:12.5px;line-height:1.5;color:var(--soft)}
.shot .label{display:block;margin-bottom:4px}
.redo{margin:-4px 0 10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.redo textarea{width:100%;flex:none;max-height:none;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.redo .pair{gap:14px;align-items:center}
.redo .warn{color:#e0a36b}
.making{position:relative}.making::after{content:"Making a new one";position:absolute;inset:0 0 12px;display:flex;align-items:center;justify-content:center;background:rgba(10,10,10,.6);color:var(--ink);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:10px}
.earlier{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.earlier img{width:30px;height:53px;object-fit:cover;border-radius:4px;opacity:.7}.earlier button:hover img{opacity:1}
.desk{position:fixed;inset:0;display:flex;background:var(--bg)}
.desk iframe{flex:1;min-width:0;height:100%;border:0}
.side{width:320px;min-width:0;flex:none;display:flex;flex-direction:column;padding:22px 24px;font-size:14px;line-height:1.6}
.handle{flex:none;width:9px;margin:0 -4px;position:relative;z-index:2;cursor:col-resize;touch-action:none;outline:none}
.handle::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--line);transition:background .15s,width .15s}
.handle:hover::before,.handle:focus-visible::before,.handle.on::before{background:var(--ink);width:2px}
.desk.dragging,.desk.dragging *{cursor:col-resize;user-select:none}
.desk.dragging iframe{pointer-events:none}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:500;letter-spacing:-.035em}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.home{display:flex;align-items:center;gap:9px;font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.home:hover{opacity:.75}.home:focus-visible{outline:1px solid var(--ink);outline-offset:4px;border-radius:4px}
.side h2{font-size:22px;line-height:1.22;font-weight:300;letter-spacing:-.03em;margin-top:18px;overflow-wrap:anywhere}
.side .label{margin-top:8px}
.side .brand{position:relative;padding-bottom:14px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.side .brand::after{content:"";position:absolute;left:0;bottom:-1px;width:28%;height:1px;background:var(--ink);opacity:0}
.desk.working .side .brand::after{opacity:1;animation:sweep 1.4s ease-in-out infinite alternate}
.desk.working .brand i,.desk.working .open i{animation:pulse .9s infinite alternate}
@keyframes sweep{from{left:0}to{left:72%}}
.burger{margin-left:auto;width:30px;height:26px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink)}
.burger span{display:block;width:17px;height:2px;border-radius:1px;background:currentColor;animation:barglow 2.2s ease-in-out infinite}
.burger.on span{animation:none}
@keyframes barglow{0%,100%{opacity:.5;box-shadow:0 0 0 rgba(232,230,227,0)}50%{opacity:1;box-shadow:0 0 10px 1px rgba(232,230,227,.95)}}
@keyframes glow{0%,100%{color:var(--soft);text-shadow:0 0 0 rgba(232,230,227,0)}50%{color:var(--ink);text-shadow:0 0 12px rgba(232,230,227,.95)}}
.scrim{display:none;position:fixed;inset:0;z-index:4}
.menu{display:none;position:absolute;top:34px;right:0;z-index:5;min-width:210px;padding:6px;background:#212425;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.brand.menuon .scrim,.brand.menuon .menu{display:block}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:400;letter-spacing:.01em;animation:glow 2.2s ease-in-out infinite}
.menu button:nth-child(2){animation-delay:.25s}.menu button:nth-child(3){animation-delay:.5s}
.menu button:hover,.menu button:focus-visible{background:rgba(232,230,227,.08);animation:none;color:var(--ink)}
.grow{animation:glow 2.2s ease-in-out infinite;width:26px;height:26px;border-radius:50%;color:var(--soft);font-size:18px;line-height:26px;text-align:center}
.grow:hover{color:var(--ink)}
.title{display:none;margin-left:14px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:300;letter-spacing:-.02em;color:var(--soft)}
a.row{color:inherit;text-decoration:none}
.row em{display:block;margin-top:6px;font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.desk.max iframe,.desk.max .handle,.desk.max .shut{display:none}
.desk.max .side{width:100%!important;padding:22px 32px 28px}
.desk.max .side>*{width:100%;max-width:720px;margin-left:auto;margin-right:auto}
.desk.max .brand{order:-2;font-size:16px}
.desk.max .title{display:block}
.desk.max .thread{font-size:15px}
.shut{width:26px;height:26px;border-radius:50%;color:var(--faint);font-size:18px;line-height:26px;text-align:center}
.shut:hover{color:var(--ink)}
.open{display:none;position:absolute;right:28px;bottom:24px;z-index:3;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:500;letter-spacing:-.035em;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.open i{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.desk.closed .open{display:flex}
.desk.closed .side,.desk.closed .handle{display:none}
.plus{flex:none;width:30px;height:30px;border-radius:50%;color:var(--soft);font-size:20px;line-height:28px;text-align:center}
.plus:hover{color:var(--ink)}
.tray{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tray:empty{display:none}
.chip{display:flex;align-items:center;gap:6px;max-width:100%;padding:4px 6px 4px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--soft)}
.chip.up{opacity:.5}
.chip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip button{flex:none;width:18px;height:18px;line-height:18px;text-align:center;color:var(--faint)}
.chip button:hover{color:var(--ink)}
.att{display:block;margin-top:5px;font-size:11px;color:var(--faint)}
.side.over .input{border-color:var(--ink)}
.on{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px;font-size:12px;line-height:1.45;color:var(--faint)}
.ask .pair{margin-top:10px;gap:8px}
.thread{flex:1;min-height:0;overflow-y:auto;margin:22px -6px 0 0;padding-right:6px;display:flex;flex-direction:column;gap:14px;scrollbar-color:var(--line) transparent}
.thread>*{flex-shrink:0}
.msg{color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}.msg a{color:var(--ink)}
.calm{color:var(--faint)}
.me{align-self:flex-end;max-width:88%;background:#212425;border-radius:14px;padding:8px 13px;white-space:pre-wrap;overflow-wrap:anywhere}
.me .label{display:block}
.live{display:flex;align-items:center;gap:9px;color:var(--faint);font-size:12px}
.live::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink);animation:pulse .9s infinite alternate}
.card{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.quote{font-size:13px;line-height:1.5;margin-top:5px;overflow-wrap:anywhere}
.opt{display:block;width:100%;text-align:left;padding:8px 0;margin-top:5px;border-top:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--soft)}
.opt:hover{color:var(--ink)}
.input{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:16px;padding:9px 9px 9px 14px;margin-top:12px;transition:border-color .15s}
.input:focus-within{border-color:var(--faint)}
.arrow{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:15px;line-height:30px;text-align:center}
.arrow[disabled]{opacity:.22;cursor:default}
.starters{margin-top:2px}
.starter{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--soft)}
.starter:last-child{border-bottom:1px solid var(--line)}
.starter:hover{color:var(--ink)}
.pair{display:flex;gap:18px}
.sub{margin-top:26px;font-size:14px;color:var(--faint);display:flex;align-items:center;gap:10px}
.sub::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pulse .9s infinite alternate}
textarea:focus-visible{outline:none}
textarea{flex:1;min-width:0;max-height:140px;overflow:hidden;padding:4px 0;background:none;border:0;color:var(--ink);font:inherit;letter-spacing:inherit;resize:none;outline:none}
textarea::placeholder{color:var(--faint)}
.foot{padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.small{background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;border-radius:999px;padding:6px 16px;white-space:nowrap}
.small[disabled]{opacity:.28;cursor:default}
.text{color:var(--faint);font-size:12px;white-space:nowrap}.text:hover{color:var(--ink)}
.side .wait{font-size:16px;justify-content:flex-start}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="dot"></div>
<main id="app"></main>
<script>
const app=document.getElementById("app"),store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let token=store.get("pp_token"),me=null,deskTimer=null,deskRun=0;
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==="on")for(const[n,f]of Object.entries(v))e.addEventListener(n,f);else if(a==="class")e.className=v;else e[a]=v}e.append(...k.filter(x=>x!=null));return e};
const api=async(path,body)=>{const r=await fetch("/panel"+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});return{status:r.status,data:await r.json()}};
const show=(...k)=>{app.replaceChildren(h("div",{class:"screen"},...k));window.scrollTo(0,0)};
const wait=t=>show(h("div",{class:"wait",textContent:t}));
let view=0;const nav=h("nav",{class:"nav",ariaLabel:"Menu"});document.body.append(nav);
function navOn(here){
  document.body.classList.add("nav-on");
  const item=(t,f,k)=>h("button",{class:k===here?"here":"",textContent:t,on:{click:f}});
  nav.replaceChildren(h("div",{class:"brand"},h("button",{class:"home",title:"Home",ariaLabel:"PlotPointe home",on:{click:today}},h("i"),"PlotPointe")),item("Create another",today,"today"),item("My scripts",scripts,"scripts"),item("Visuals",allVisuals,"visuals"),...(me.doc?[item("Back to "+me.doc.title,()=>straight(me.doc),"doc")]:[]));
}
function navOff(){view++;document.body.classList.remove("nav-on")}
function welcome(){
  show(h("div",{class:"word",textContent:"PlotPointe"}),
    h("div",{class:"center"},h("p",{textContent:`Welcome, ${me.name}. Great stories follow laws. We've built them into your desk.`}),
    h("button",{class:"go",textContent:"Begin",on:{click:gmail}})));
}
function gmail(){
  const input=h("input",{type:"email",placeholder:"you@gmail.com",ariaLabel:"Your Gmail"}),note=h("div",{class:"error"});
  const go=async()=>{const r=await api("/email",{email:input.value.trim()});if(r.status===200)how();else note.textContent=r.data.error};
  input.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  show(h("h1",{textContent:"Which Gmail do you write in?"}),h("p",{textContent:"Your scripts live in Google Docs. We'll share each one with you."}),input,note,h("button",{class:"go",textContent:"Continue",on:{click:go}}));
  input.focus();
}
function how(){
  store.set("pp_step","today");
  show(h("h1",{textContent:"How it works"}),h("ul",{class:"steps"},h("li",{textContent:"Pick a story."}),h("li",{textContent:"Write in your Google Doc. We'll sit beside you."}),h("li",{textContent:"Press Complete when you love it."})),
    h("button",{class:"go",textContent:"Show me today's stories",on:{click:today}}));
}
async function today(){
  const v=++view;navOn("today");
  wait("Finding today's stories");
  for(let i=0;i<100;i++){
    const r=await api("/today");
    if(v!==view)return;
    if(r.status===200&&r.data.status==="ready")return list(r.data.ideas);
    await new Promise(d=>setTimeout(d,3000));
    if(v!==view)return;
  }
  show(h("h1",{textContent:"That took too long."}),h("button",{class:"go",textContent:"Try again",on:{click:today}}));
}
function list(ideas){
  app.replaceChildren(h("div",{class:"screen wide"},h("h1",{textContent:"Today"}),
    h("div",{class:"rows"},...ideas.map(i=>h("button",{class:"row",on:{click:()=>pick(i)}},h("b",{textContent:i.title}),h("span",{textContent:i.pitch})))),
    h("div",{class:"pair"},h("button",{class:"quiet",textContent:"Different ones",on:{click:async()=>{await api("/today/new",{});today()}}}))));
  window.scrollTo(0,0);
}
async function pick(idea){
  navOff();
  const title=idea.title;
  const crew=h("div",{class:"room"});let shown=0,halted=false,note="";
  const stopBtn=h("button",{class:"go",style:"margin-top:20px",textContent:"Stop",on:{click:async()=>{stopBtn.textContent="Stopping";halted=true;await api("/stop",{});today()}}});
  const AG={"Librarian":"#c4b5fd","Researcher":"#7dd3fc","Story Stripper":"#fca5a5","Writer 1":"#fcd34d","Writer 2":"#fdba74","Writer 3":"#f9a8d4","Hard Rules":"#e8e6e3","Read-Through":"#a5b4fc","Hook Guard":"#f0abfc","Storyteller":"#fde68a","Grader":"#67e8f9","Fact Checker":"#86efac","Fluff Cutter":"#fb923c","Final Judges":"#5eead4"};
  const crewDraw=list=>{for(const e of (list||[]).slice(shown))crew.append(h("div",{class:"agent",style:"--c:"+(AG[e.agent]||"#e8e6e3")},h("i"),h("b",{textContent:e.agent}),h("span",{textContent:e.text})));shown=Math.max(shown,(list||[]).length)};
  show(h("h1",{textContent:title}),h("p",{textContent:idea.pitch}),h("div",{class:"sub",textContent:idea.lines&&idea.lines.length?"Opening your script.":"The writers' room is on it. This takes a few minutes."}),stopBtn,crew);
  const before=(me.doc||{}).id;
  const r=await api("/pick",{title});
  if(r.status!==200)return show(h("h1",{textContent:r.data.error}),h("button",{class:"go",textContent:"Back",on:{click:today}}));
  for(let i=0;i<720;i++){
    await new Promise(d=>setTimeout(d,2500));
    if(halted)return;
    const m=await api("/me");
    if(halted)return;

    side=h("aside",{class:"side"},top=h("div",{class:"brand"},h("button",{class:"home",title:"Home",ariaLabel:"PlotPointe home",on:{click:leave}},h("i"),"PlotPointe"),h("span",{class:"title",textContent:doc.title}),burger,maxBtn,shut,scrim,menu),thread,tray,h("div",{class:"input"},plus,box,send,picker),foot)));
  setWidth(width,false);
  side.addEventListener("dragover",e=>{e.preventDefault();side.classList.add("over")});
  side.addEventListener("dragleave",e=>{if(!side.contains(e.relatedTarget))side.classList.remove("over")});
  side.addEventListener("drop",e=>{e.preventDefault();side.classList.remove("over");[...e.dataTransfer.files].forEach(attach)});
  if(store.get("pp_closed")==="1")handle.parentElement.classList.add("closed");else if(store.get("pp_max")==="1")setMax(true);

async function startPick(title){
  const same=d=>d&&(d.title||"").toLowerCase()===title.toLowerCase();
  if(same(me.doc))return straight(me.doc);                       // already written: open its doc, never a new one
  const old=(me.past||[]).find(same);if(old)return reopen(old);
  wait("Opening your story");
  for(let i=0;i<40;i++){
    const r=await api("/today");
    if(r.status===200&&r.data.status==="ready"){const idea=r.data.ideas.find(x=>x.title===title);return idea?pick(idea):list(r.data.ideas)}
    await new Promise(d=>setTimeout(d,3000));
  }
  today();
}
(async()=>{
  const code=(location.hash.match(/c=(\d+)/)||[])[1];
  const chosen=(location.hash.match(/[#&]t=([^&]+)/)||[])[1];
  const home=location.hash==="#home";
  if(chosen||home)history.replaceState(null,"",location.pathname);
  if(code){
    history.replaceState(null,"",location.pathname);
    const r=await api("/pair",{code});
    if(r.status===200){token=r.data.token;store.set("pp_token",token);store.set("pp_step","")}
    else if(!token)return show(h("h1",{textContent:"This link has expired."}),h("p",{textContent:"Ask the bot on Telegram for a new one by sending /start."}));
  }
  if(!token)return show(h("h1",{textContent:"Open PlotPointe from your Telegram link."}));
  const r=await api("/me");
  if(r.status===401)return show(h("h1",{textContent:"This link has expired."}),h("p",{textContent:"Ask the bot on Telegram for a new one by sending /start."}));
  me=r.data;
  if(chosen){store.set("pp_step","today");return startPick(decodeURIComponent(chosen))}
  api("/today").catch(()=>{});
  if(home){store.set("pp_step","today");return today()}
  const step=store.get("pp_step");
  if(step==="today"&&me.doc)desk(me.doc);else if(step==="today")today();else welcome();
})();
